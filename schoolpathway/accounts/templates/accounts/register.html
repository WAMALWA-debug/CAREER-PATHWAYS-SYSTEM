{% extends 'accounts/base.html' %}

{% block content %}

<div class="card shadow">

<div class="card-header bg-success text-white">

<h3>Student Registration</h3>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<input type="text"
name="username"
class="form-control mb-3"
placeholder="Username"
required>

<input type="email"
name="email"
class="form-control mb-3"
placeholder="Email"
required>

<input type="password"
name="password"
class="form-control mb-3"
placeholder="Password"
required>

<button class="btn btn-success">

Register

</button>

</form>

</div>

</div>

{% endblock %}
